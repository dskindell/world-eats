name: world-eats

services:
  world-eats:
    build: ./app
    image: world-eats:local
    container_name: world-eats
    restart: unless-stopped
    # Run as the host user that owns ./data (the image default, 10001, can't write to it).
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "7197:8080"
    environment:
      WORLD_EATS_ALLOWED_HOSTS: localhost
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
