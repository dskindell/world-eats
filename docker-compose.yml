name: world-eats

services:
  world-eats:
    build: ./app
    image: world-eats:local
    container_name: world-eats
    restart: unless-stopped
    ports:
      - "7197:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
